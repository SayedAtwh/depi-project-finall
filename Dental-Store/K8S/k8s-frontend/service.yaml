apiVersion: v1
kind: Service
metadata:
  name: service-frontend-dental-store
  namespace: ns-dental-store
  annotations:
      argocd.argoproj.io/sync-wave: "10"
  labels:
    app: dental-store
    tier: frontend
spec:
  type: LoadBalancer

  selector:
    app: dental-store
    tier: frontend
  ports:
    - name: frontend
      protocol: TCP
      port: 80
      targetPort: 80