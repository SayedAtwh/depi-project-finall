apiVersion: v1
kind: Service
metadata:
  name: service-backend-dental-store
  namespace: ns-dental-store
  labels:
    app: dental-store
    tier: backend
  annotations:
     argocd.argoproj.io/sync-wave: "7"
spec:
  type: ClusterIP
  selector:
    app: dental-store
    tier: backend
  ports:
    - name: backend
      protocol: TCP
      port: 80
      targetPort: 80