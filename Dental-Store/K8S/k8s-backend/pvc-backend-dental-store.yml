apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-backend-dental-store
  namespace: ns-dental-store
  labels:
    name: dental-store
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: sc-dental-store
  resources:
    requests:
      storage: 20Gi