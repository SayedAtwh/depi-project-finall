apiVersion: v1
kind: Service
metadata:
  name: service-database-dental-store
  namespace: ns-dental-store
  labels:
    app: dental-store
    tier: database
  annotations:
     argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: dental-store
    tier: database
  ports:
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: 3306