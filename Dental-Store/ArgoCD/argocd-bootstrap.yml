apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-bootstrab-dental-store
  namespace: argocd
  labels:
    app: dental-store
    tier: bootstrap
spec:
  project: default
  source:
    repoURL: "https://github.com/SayedAtwh/depi-project-finall.git"
    targetRevision: main
    path: Dental-Store/ArgoCD/argocd-application
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10