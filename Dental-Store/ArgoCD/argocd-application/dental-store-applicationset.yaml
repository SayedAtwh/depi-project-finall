apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dental-store-applicationset
  namespace: argocd

spec:
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: tier
              operator: In
              values:
                - database
        - matchExpressions:
            - key: tier
              operator: In
              values:
                - backend
        - matchExpressions:
            - key: tier
              operator: In
              values:
                - frontend

  generators:
    - list:
        elements:
          - name: argocd-database-app-dental-store
            path: Dental-Store/K8S/k8s-database
            tier: database

          - name: argocd-backend-app-dental-store
            path: Dental-Store/K8S/k8s-backend
            tier: backend

          - name: argocd-frontend-app-dental-store
            path: Dental-Store/K8S/k8s-frontend
            tier: frontend

  template:
    metadata:
      name: "myapp-{{name}}"
      labels:
        tier: "{{tier}}"

    spec:
      project: default

      source:
        repoURL: https://github.com/SayedAtwh/depi-project-finall.git
        targetRevision: main
        path: "{{path}}"
        directory:
          recurse: true

      destination:
        server: https://kubernetes.default.svc
        namespace: ns-dental-store

      syncPolicy:
        syncOptions:
          - CreateNamespace=true

      revisionHistoryLimit: 10