apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dental-store-applicationset
  namespace: argocd

spec:
  generators:
    - list:
        elements:
          - name: argocd-database-app-dental-store
            tier: database
            path: Dental-Store/K8S/k8s-database

          - name: argocd-backend-app-dental-store
            tier: backend
            path: Dental-Store/K8S/k8s-backend

          - name: argocd-frontend-app-dental-store
            tier: frontend
            path: Dental-Store/K8S/k8s-frontend

  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: tier
              operator: In
              values:
                - database
          maxUpdate: 100%

        - matchExpressions:
            - key: tier
              operator: In
              values:
                - backend
          maxUpdate: 100%

        - matchExpressions:
            - key: tier
              operator: In
              values:
                - frontend
          maxUpdate: 100%

  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{name}}'
      labels:
        app: dental-store
        tier: '{{tier}}'

    spec:
      project: default

      source:
        repoURL: https://github.com/SayedAtwh/depi-project-finall.git
        targetRevision: main
        path: '{{path}}'
        directory:
          recurse: true

      destination:
        server: https://kubernetes.default.svc
        namespace: ns-dental-store

      syncPolicy:
        syncOptions:
          - CreateNamespace=true