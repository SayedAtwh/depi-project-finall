services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.front
    container_name: dental-frontend
    ports:
      - "9000:80"
    depends_on:
      - backend
    networks:
      - dental-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dental-backend
    environment:
      DB_HOST: mysql
      DB_NAME: dental_store
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dental-network
    restart: unless-stopped

  mysql:
    build:
      context: .
      dockerfile: Dockerfile.database
    container_name: dental-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dental_store
    volumes:
      - dental-data:/var/lib/mysql
    networks:
      - dental-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  dental-network:
    driver: bridge

volumes:
  dental-data: